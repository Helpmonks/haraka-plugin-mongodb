services:
  test:
    image: node:24.16.0-bookworm
    working_dir: /workspace
    environment:
      MONGODB_URL: mongodb://mongodb:27017/haraka_plugin_test
      PNPM_HOME: /pnpm
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    command: >-
      sh -lc "npm install --global pnpm@11.22.0 &&
      pnpm install --store-dir /pnpm/store --frozen-lockfile &&
      pnpm test &&
      pnpm lint"

  mongodb:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  node_modules:
  pnpm_store:
